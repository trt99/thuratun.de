# Copies data from the published Google Sheet tab (thuratun.de) every 6 hours:
#   columns A to C   payment method counts  -> counts.json
#   "DE Bank List"   German banks            -> banks.json
#   "Device" / OS / Category (3 columns)     -> devices.json
# The website reads these files from GitHub, so visitors' browsers never contact Google.
# When something changed, this workflow also publishes the site to GitHub Pages,
# because commits made by a workflow do not start the normal Pages deployment.
# Starting it by hand (Run workflow) always publishes the site.
name: Update site data from Google Sheet

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Download sheet and build the JSON files
        env:
          SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVYTUsxq-cAAFAapxpAZU8_kNgnLfUmBUIpnLyUuEUd1HsezBntH3r9PLFDoPye5cM-7g6k4y6kKCU/pub?gid=1658616993&single=true&output=csv"
        run: |
          python3 - <<'PY'
          import csv, io, json, os, re, sys, urllib.request
          from datetime import datetime, timezone

          raw = urllib.request.urlopen(os.environ["SHEET_CSV_URL"], timeout=30).read().decode("utf-8")
          table = list(csv.reader(io.StringIO(raw)))
          if not table:
              sys.exit("The sheet is empty, keeping the old files")
          head = [h.strip().lower() for h in table[0]]
          body = table[1:]
          cell = lambda r, i: (r[i] if i is not None and i < len(r) else "").strip()
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def save(path, rows, label):
              if not rows:
                  print(label + ": nothing found in the sheet, keeping the old file")
                  return
              old = {}
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as f:
                      old = json.load(f)
              if old.get("rows") == rows:
                  print(label + ": unchanged")
                  return
              with open(path, "w", encoding="utf-8") as f:
                  json.dump({"updated": now, "rows": rows}, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print(label + ": updated (" + str(len(rows)) + " rows)")

          # Payment method counts: name in A, Germany in B, other countries in C
          num = lambda v: int(re.sub(r"[^0-9]", "", v or "") or 0)
          counts = []
          for r in body:
              name = cell(r, 0)
              if not name or re.search("total", name, re.I):
                  continue
              de, other = num(cell(r, 1)), num(cell(r, 2))
              if de + other > 0:
                  counts.append([name, de, other])
          save("counts.json", counts, "Counts")

          # German banks: the column whose header contains "bank"
          bcol = next((i for i, h in enumerate(head) if "bank" in h), None)
          banks = []
          if bcol is not None:
              for r in body:
                  name = cell(r, bcol)
                  if name and [name] not in banks:
                      banks.append([name])
          save("banks.json", banks, "Banks")

          # Devices: the column with the header "Device", then OS and Category next to it
          dcol = next((i for i, h in enumerate(head) if h.startswith("device")), None)
          devices = []
          if dcol is not None:
              for r in body:
                  name = cell(r, dcol)
                  if name:
                      devices.append([name, cell(r, dcol + 1) or "N/A", cell(r, dcol + 2)])
          save("devices.json", devices, "Devices")
          PY

      - name: Commit if changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain counts.json banks.json devices.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add counts.json banks.json devices.json
            git commit -m "Update data from Google Sheet"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # Runs when the data changed, or always when started by hand (Run workflow)
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
